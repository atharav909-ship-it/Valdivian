{% extends 'base.html' %}{% block title %}Product editor{% endblock %}{% block content %}<section class="container form-wrap"><div class="form-panel wide"><span class="eyebrow">ADMIN · PRODUCT</span><h1>{{ 'Edit product' if product.id else 'Add product' }}</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" required maxlength="120" value="{{ product.name or '' }}"></label><label>Category<input name="category" required maxlength="60" value="{{ product.category or '' }}"></label><label>Description<textarea name="description" required rows="4">{{ product.description or '' }}</textarea></label><div class="two-cols"><label>Price (₹)<input name="price" type="number" step="0.01" min="0.01" required value="{{ product.price or '' }}"></label><label>Stock<input name="stock" type="number" min="0" required value="{{ product.stock if product.stock is not none else 0 }}"></label></div><label>Image URL (optional)<input name="image_url" type="url" value="{{ product.image_url or '' }}"></label><button class="button">Save product →</button></form></div></section>{% endblock %}
