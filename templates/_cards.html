<div class="grid">{% for product in products %}<article class="card"><a class="card-image" href="{{ url_for('product_detail', product_id=product.id) }}">{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">{% else %}<span class="placeholder">SF</span>{% endif %}</a><div class="card-body"><span class="eyebrow">{{ product.category }}</span><a class="card-title" href="{{ url_for('product_detail', product_id=product.id) }}">{{ product.name }}</a><div class="card-bottom"><strong>₹{{ '%.2f'|format(product.price) }}</strong><span>{{ 'In stock' if product.stock else 'Sold out' }}</span></div></div></article>{% else %}<p class="empty">No products found. Try a different search.</p>{% endfor %}</div>
